services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: askroot, POSTGRES_USER: askroot, POSTGRES_PASSWORD: ${DB_PASSWORD} }
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U askroot"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  backend:
    build: ./backend
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/askroot
      DB_USER: askroot
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:8080/actuator/health"], interval: 10s }

  frontend:
    build: ./frontend
    depends_on: [ backend ]

  nginx:
    image: nginx:1.27-alpine
    ports: [ "8080:80" ]
    volumes: [ "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    depends_on: [ frontend, backend ]

volumes: { pgdata: {} }
