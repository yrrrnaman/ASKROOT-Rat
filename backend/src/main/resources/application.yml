server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/askroot}
    username: ${DB_USER:askroot}
    password: ${DB_PASSWORD:askroot}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health

askroot:
  jwt:
    issuer: askroot
    access-ttl: 15m
    refresh-ttl: 7d
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  agent:
    command-timeout: 15s
    max-output-bytes: 262144
  files:
    allowed-roots: /home/askroot,/var/log
    max-upload-bytes: 26214400
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
